/* =========================================================
   读取 Trips
========================================================= */

let trips =
  JSON.parse(
    localStorage.getItem(
      "travelTrips"
    )
  ) || DEFAULT_TRIPS;


/* =========================================================
   数据兼容
========================================================= */

trips.forEach(trip => {

  if (!trip.itinerary) {
    trip.itinerary = [];
  }

  if (!trip.hotel) {
    trip.hotel = [];
  }

  if (!trip.transport) {
    trip.transport = [];
  }

  if (!trip.places) {
    trip.places = [];
  }

  if (!trip.expense) {
    trip.expense = [];
  }

});


/* =========================================================
   当前状态
========================================================= */

let currentTripId = null;

let currentPage =
  "itinerary";

let editingId = null;

let editingType = null;

let expenseItineraryId = null;

let viewingId = null;

let viewingType = null;

let placesSearchKeyword = "";


/* =========================================================
   IndexedDB
========================================================= */

const FILE_DB_NAME =
  "travelAppFiles";

const FILE_DB_VERSION = 1;

const FILE_STORE =
  "files";


function openFileDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          FILE_DB_NAME,
          FILE_DB_VERSION
        );

      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames.contains(
              FILE_STORE
            )
          ) {

            db.createObjectStore(
              FILE_STORE,
              {
                keyPath: "id"
              }
            );

          }

        };

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function saveFileToDB(
  file,
  itineraryId
) {

  const db =
    await openFileDB();

  const id =
    "file_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const record = {

        id,

        itineraryId,

        name:
          file.name,

        type:
          file.type ||
          "application/octet-stream",

        size:
          file.size,

        createdAt:
          new Date().toISOString(),

        blob:
          file

      };

      const request =
        store.put(record);

      request.onsuccess =
        function() {

          resolve(record);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function getFilesForItinerary(
  itineraryId
) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readonly"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.getAll();

      request.onsuccess =
        function() {

          const result =
            request.result
            .filter(
              item =>
                String(
                  item.itineraryId
                ) ===
                String(
                  itineraryId
                )
            )
            .sort(
              (a,b) =>
                (
                  a.createdAt || ""
                )
                .localeCompare(
                  b.createdAt || ""
                )
            );

          resolve(result);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}

        );

      const request =
        store.get(id);

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function deleteFileFromDB(id) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.delete(id);

      request.onsuccess =
        function() {

          resolve();

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}

/* =========================================================
   Escape
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   日期
========================================================= */

function formatDate(dateString) {

  if (!dateString) return "";

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  return date.toLocaleDateString(
    "zh-CN",
    {
      month: "long",
      day: "numeric",
      weekday: "short"
    }
  );

}


function formatDateRange(
  start,
  end
) {

  if (!start && !end) {
    return "";
  }

  if (
    start &&
    end
  ) {

    return `
      ${formatDate(start)}
      → 
      ${formatDate(end)}
    `;

  }

  return formatDate(
    start || end
  );

}


/* =========================================================
   文件大小
========================================================= */

function formatFileSize(size) {

  if (!size) return "0 KB";

  if (
    size < 1024
  ) {

    return size + " B";

  }

  if (
    size < 1024 * 1024
  ) {

    return (
      (size / 1024)
      .toFixed(1)
    ) +
    " KB";

  }

  return (
    (size /
      1024 /
      1024)
      .toFixed(1)
  ) +
  " MB";

}

/* =========================================================
   Page
========================================================= */

function switchPage(page) {

  currentPage = page;

  viewingId = null;

  viewingType = null;

  if (
    page !== "places"
  ) {

    placesSearchKeyword = "";

  }

  renderTrip();

}


function renderPage() {

  const trip =
    getCurrentTrip();

  const content =
    document.getElementById(
      "tripContent"
    );

  if (!trip) return;


  if (!trip.expense) {
    trip.expense = [];
  }

  if (!trip.itinerary) {
    trip.itinerary = [];
  }

  if (!trip.hotel) {
    trip.hotel = [];
  }

  if (!trip.transport) {
    trip.transport = [];
  }

  if (!trip.places) {
    trip.places = [];
  }


  if (
    viewingId !== null &&
    viewingType
  ) {

    renderItemView(
      content,
      trip,
      viewingType,
      viewingId
    );

    return;

  }


  if (
    currentPage === "itinerary"
  ) {

    renderItinerary(
      content,
      trip
    );

  }

  else if (
    currentPage === "expense"
  ) {

    renderExpense(
      content,
      trip
    );

  }

  else {

    renderGeneric(
      content,
      trip,
      currentPage
    );

  }

}


/* =========================================================
   行程
========================================================= */

function renderItinerary(
  content,
  trip
) {

  const items =
    [...(trip.itinerary || [])]
    .sort(
      (a,b) =>
        (
          (a.date || "") +
          (a.time || "")
        )
        .localeCompare(
          (b.date || "") +
          (b.time || "")
        )
    );


  let html = `

    <div class="section-header">

      <h2>
        📅 每日行程
      </h2>


      <button
        class="add-button"
        onclick="
          openModal('itinerary')
        ">

        ＋ 添加

      </button>

    </div>

  `;


  if (!items.length) {

    html += `

      <div class="empty">

        还没有行程

        <br><br>

        按「＋ 添加」
        开始吧 ✨

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  const groups = {};


  items.forEach(item => {

    const date =
      item.date ||
      "未设日期";

    if (!groups[date]) {
      groups[date] = [];
    }

    groups[date].push(item);

  });


  Object.keys(groups)
    .sort()
    .forEach(date => {

      html += `

        <div class="day">

          <div class="day-title">

            ${
              date === "未设日期"
              ?
              "📅 未设日期"
              :
              formatDate(date)
            }

          </div>

      `;


      groups[date].forEach(item => {

        html += renderItem(
          item,
          "itinerary",
          trip
        );

      });


      html += `</div>`;

    });


  content.innerHTML = html;

}


/* =========================================================
   酒店 / 交通 / 美食景点
========================================================= */

function renderGeneric(
  content,
  trip,
  type
) {

  const titles = {

    hotel:
      "🏨 酒店",

    transport:
      "🚄 交通",

    places:
      "📍 美食 & 景点"

  };


  let html = `

    <div class="section-header">

      <h2>
        ${titles[type]}
      </h2>


      <button
        class="add-button"
        onclick="
          openModal('${type}')
        ">

        ＋ 添加

      </button>

    </div>

  `;


  if (
    type === "places"
  ) {

    html += `

      <div class="search-box">

        <input
          id="placesSearch"
          type="search"
          placeholder="🔍 搜索美食、景点、地点或备注"
          value="${escapeHTML(
            placesSearchKeyword
          )}"
          oninput="
            placesSearchKeyword = this.value;
            renderPlacesResults();
          ">

      </div>

    `;

  }


  let items =
    [...(trip[type] || [])];


  if (
    type === "places" &&
    placesSearchKeyword.trim()
  ) {

    const keyword =
      placesSearchKeyword
        .trim()
        .toLowerCase();


    items =
      items.filter(item => {

        const text = [

          item.name || "",
          item.place || "",
          item.note || "",
          item.member || "",
          item.date || "",
          item.startDate || "",
          item.endDate || ""

        ]
        .join(" ")
        .toLowerCase();


        return text.includes(
          keyword
        );

      });

  }


  if (!items.length) {

    html += `

      <div class="empty">

        ${
          type === "places" &&
          placesSearchKeyword.trim()
          ?
          "找不到符合的资料"
          :
          "还没有资料"
        }

        ${
          !(
            type === "places" &&
            placesSearchKeyword.trim()
          )
          ?
          `
            <br><br>

            按「＋ 添加」
            开始吧 ✨
          `
          :
          ""
        }

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  items.forEach(item => {

    html += renderItem(
      item,
      type,
      trip
    );

  });


  content.innerHTML = html;

}
