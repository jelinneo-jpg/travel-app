/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHTML(value) {

  if (!value) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================

========================================================= */

function formatDate(dateString) {

  if (!dateString) {
    return "";
  }

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "zh-CN",
    {
      month: "long",
      day: "numeric",
      weekday: "short"
    }
  );

}

function renderItinerary(content) {

  const items =
    [...data.itinerary]
      .sort(
        (a, b) =>
          (a.date + a.time)
          .localeCompare(
            b.date + b.time
          )
      );


  let html = `

    <div class="section-header">

      <h2>
        📅 每日行程

      <button
        class="add-button"
        onclick="openModal('itinerary')">

        ＋ 添加

    </div>

    html += `
      <div class="empty">
        还没有行程<br>
        按「＋ 添加」开始吧 ✨
      </div>
    `;

    content.innerHTML = html;

    return;

  }


  const groups = {};


  items.forEach(item => {

    if (!groups[item.date]) {

      groups[item.date] = [];

    }

    groups[item.date].push(item);

  });


  Object.keys(groups)
    .sort()
    .forEach(date => {

      html += `

        <div class="day">

            ${formatDate(date)}

      groups[date]

          html += renderItem(

            "itinerary"
          );

        });


      html += `
        </div>
      `;

    });


  content.innerHTML = html;

}
