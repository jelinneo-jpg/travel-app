<!DOCTYPE html>
<html lang="zh-CN">

<title>我们的旅行 ✈️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff9f5;
  color: #4d4140;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",

}

button,
input,
textarea,
select {

button {
  cursor: pointer;

.app {

/* =========================
   Header
========================= */

  font-weight: 800;

========================= */

.home-title {
  font-size: 21px;

.add-trip-button {

  background: #efa37c;
  color: white;
  padding: 10px 13px;
  border-radius: 13px;

}


/* =========================
   Trip Card
========================= */

.trip-list-card {
  position: relative;
  margin-bottom: 15px;
  padding: 22px;

    linear-gradient(
      135deg,
      #fff,
      #fff0e7

}

.trip-card-title {
  font-size: 22px;
  font-weight: 800;

}

.trip-card-date {
  margin-top: 7px;

  font-size: 14px;
}

.trip-card-members {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 15px;
}

.member {
  padding: 6px 10px;
  border-radius: 999px;
  background: white;
  border: 1px solid #efd9ce;
  font-size: 12px;
}

.trip-arrow {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);

  color: #d99270;
}

.trip-card-actions {
  display: flex;
  gap: 7px;
  margin-top: 15px;
}

.small-action {
  padding: 8px 11px;
  border-radius: 10px;
  border: 1px solid #efddd3;
  background: white;
  color: #665957;

/* =========================
   Trip Header
========================= */

.trip-header-card {

      #fff,

    );
  border: 1px solid #f2ddd2;
  border-radius: 24px;
  box-shadow:
    0 10px 30px
    rgba(120,80,60,.07);
}

.back-button {
  border: 0;
  background: transparent;
  padding: 0;

  font-weight: 700;
  margin-bottom: 12px;
}

.trip-header-title {
  font-size: 24px;
  font-weight: 800;
}

.trip-header-date {

.trip-header-members {

/* =========================
   Tabs
========================= */

.tabs {

}

.tab {

}

/* =========================
   Content
========================= */

.content {

}

.section-header {

.add-button {

/* =========================

========================= */

/* =========================

========================= */

.item {

}

.action-button,

  border-radius: 10px;

}

.link-button {

}

/* =========================

========================= */

.add-itinerary-button {

.disabled-button {

/* =========================

========================= */

.file-card {

.file-open-button,

}

.split-box {

  background: #fdf8f5;

  color: #756763;
  font-size: 13px;
}

.expense-note {
  margin-top: 8px;

  font-size: 13px;

/* =========================
   Total
========================= */

.total-card {
  margin: 12px 0;
  padding: 20px;

      135deg,
      #fff,
      #fff1e8

}

.total-label {

}

.total-money {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 22px;
  font-weight: 800;
}

.total-currency {
  line-height: 1.3;
}

.expense-hint {
  margin: 0 2px 12px;
  color: #978984;
  font-size: 12px;
}


/* =========================
   Empty
========================= */

.empty {
  padding: 38px 15px;
  text-align: center;
  color: #978984;
  background: white;
  border: 1px dashed #ead7ce;
  border-radius: 18px;
}


/* =========================
   Modal
========================= */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  padding: 18px;
  align-items: flex-end;
  justify-content: center;
  background:
    rgba(50,35,30,.38);
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: min(650px,100%);
  max-height: 92vh;
  overflow-y: auto;
  padding: 21px;
  background: white;
  border-radius:
    25px 25px 17px 17px;
}

.modal-title {
  margin: 0 0 16px;
  font-size: 21px;
  font-weight: 800;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #8d7e79;
  font-size: 13px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ead9d1;
  border-radius: 12px;
  background: #fffaf7;
  color: #4d4140;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #efa37c;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;

.currency-row {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 10px;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.cancel-button,

  padding: 11px 15px;
  border-radius: 12px;
}

.cancel-button {
  border: 1px solid #ead9d1;
  background: white;
}

.save-button {
  border: 0;
  background: #efa37c;
  color: white;
  font-weight: 700;
}


/* =========================
   Members
========================= */

.member-select {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.member-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 11px;
  border: 1px solid #ead9d1;
  border-radius: 999px;
  background: #fffaf7;
  font-size: 13px;
}

.member-check input {
  width: auto;
}


/* =========================
   费用 Participants
========================= */

.participant-select {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.participant-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 11px;
  border: 1px solid #ead9d1;
  border-radius: 999px;
  background: #fffaf7;
  font-size: 13px;
}

.participant-check input {
  width: auto;
}


/* =========================
   手机
========================= */

@media (max-width:600px) {

  .form-row {
    grid-template-columns: 1fr;
  }

  }

  }

  .item-top {
    align-items: flex-start;
  }

  .expense-card-title {

  }

</style>

</head>

<div

<script>


/* =========================================================
   成员
========================================================= */

const MEMBERS = [
  "Lynn",
  "Vincent",
  "Esther",
  "Tong"
];


/* =========================================================
   默认 Trip
========================================================= */

const DEFAULT_TRIPS = [

  {

    id: 1,

    name:
      "🇭🇰 香港 → 广州 → 成都 → 三江",

    startDate:
      "2026-11-06",

    endDate:
      "2026-11-15",

    members: [
      "Lynn",
      "Vincent",
      "Esther",
      "Tong"
    ],

    itinerary: [

      {

        id: 101,
        date: "2026-11-06",
        time: "10:00",
        icon: "✈️",
        name: "新加坡 → 香港",
        place: "香港机场",
        member: "Lynn",
        note: "抵达后前往酒店",
        link: "",
        map: ""

      },

      {

        id: 102,
        date: "2026-11-06",
        time: "16:00",
        icon: "🏨",
        name: "酒店 Check-in",
        place: "九龙",
        member: "Vincent",
        note: "",
        link: "",
        map: ""

      },

      {

        id: 103,
        date: "2026-11-07",
        time: "19:00",
        icon: "🍜",
        name: "晚餐",
        place: "尖沙咀",
        member: "Esther",
        note: "",
        link: "",
        map: ""

      },

      {

        id: 104,
        date: "2026-11-08",
        time: "12:30",
        icon: "🚄",
        name: "香港 → 广州",
        place: "香港西九龙",
        member: "Tong",
        note: "高铁",
        link: "",
        map: ""

      }

    ],

    hotel: [],
    transport: [],
    places: [],
    expense: []

  }

];


/* =========================================================
   读取 Trips
========================================================= */

let trips =
  JSON.parse(
    localStorage.getItem(
      "travelTrips"
    )
  ) || DEFAULT_TRIPS;


/* =========================================================
   数据兼容 / 初始化
========================================================= */

trips.forEach(trip => {

  if (!trip.itinerary) {
    trip.itinerary = [];
  }

  if (!trip.hotel) {
    trip.hotel = [];
  }

  if (!trip.transport) {
    trip.transport = [];
  }

  if (!trip.places) {
    trip.places = [];
  }

  if (!trip.expense) {
    trip.expense = [];
  }

});


/* =========================================================
   当前 Trip
========================================================= */

let currentTripId = null;

let currentPage =
  "itinerary";

let editingId = null;

let editingType = null;

let expenseItineraryId = null;


/* =========================================================
   美食景点搜索
========================================================= */

let placesSearchKeyword = "";


/* =========================================================
   IndexedDB 文件数据库
========================================================= */

const FILE_DB_NAME =
  "travelAppFiles";

const FILE_DB_VERSION = 1;

const FILE_STORE =
  "files";


function openFileDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          FILE_DB_NAME,
          FILE_DB_VERSION
        );

      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames.contains(
              FILE_STORE
            )
          ) {

            db.createObjectStore(
              FILE_STORE,
              {
                keyPath: "id"
              }
            );

          }

        };

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function saveFileToDB(
  file,
  itineraryId
) {

  const db =
    await openFileDB();

  const id =
    "file_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const record = {

        id,

        itineraryId,

        name:
          file.name,

        type:
          file.type ||
          "application/octet-stream",

        size:
          file.size,

        createdAt:
          new Date().toISOString(),

        blob:
          file

      };

      const request =
        store.put(record);

      request.onsuccess =
        function() {

          resolve(record);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function getFilesForItinerary(
  itineraryId
) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readonly"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.getAll();

      request.onsuccess =
        function() {

          const result =
            request.result
            .filter(
              item =>
                String(
                  item.itineraryId
                ) ===
                String(
                  itineraryId
                )
            )
            .sort(
              (a,b) =>
                (
                  a.createdAt || ""
                )
                .localeCompare(
                  b.createdAt || ""
                )
            );

          resolve(result);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function getFileById(id) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readonly"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.get(id);

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function deleteFileFromDB(id) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.delete(id);

      request.onsuccess =
        function() {

          resolve();

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   保存
========================================================= */

function saveTrips() {

  localStorage.setItem(
    "travelTrips",
    JSON.stringify(trips)
  );

}


/* =========================================================
   生成 ID
========================================================= */

function createId() {

  return Date.now() +
    Math.floor(
      Math.random() * 100000
    );

}


/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   日期
========================================================= */

function formatDate(dateString) {

  if (!dateString) return "";

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  return date.toLocaleDateString(
    "zh-CN",
    {
      month: "long",
      day: "numeric",
      weekday: "short"
    }
  );

}


/* =========================================================
   文件大小
========================================================= */

function formatFileSize(size) {

  if (!size) return "0 KB";

  if (
    size < 1024
  ) {

    return size + " B";

  }

  if (
    size < 1024 * 1024
  ) {

    return (
      (size / 1024)
      .toFixed(1)
    ) +
    " KB";

  }

  return (
    (size /
      1024 /
      1024)
      .toFixed(1)
  ) +
  " MB";

}

/* =========================================================

========================================================= */

function renderItinerary(
  content,
  trip
) {

  const items =
    [...(trip.itinerary || [])]
    .sort(
      (a,b) =>
        (
          (a.date || "") +
          (a.time || "")
        )
        .localeCompare(
          (b.date || "") +
          (b.time || "")
        )
    );

  let html = `

    <div class="section-header">

      <h2>
        📅 每日行程
      </h2>


      <button
        class="add-button"
        onclick="
          openModal('itinerary')
        ">

        ＋ 添加

      </button>

    </div>

  `;

  if (!items.length) {

    html += `

      <div class="empty">

        还没有行程

        <br><br>

        按「＋ 添加」
        开始吧 ✨

      </div>

    `;

    content.innerHTML = html;

    return;

  }

  const groups = {};

  items.forEach(item => {

    const date =
      item.date ||
      "未设日期";

    if (!groups[date]) {

      groups[date] = [];

    }

    groups[date].push(item);

  });


  Object.keys(groups)

    .sort()

    .forEach(date => {

      html += `

        <div class="day">

          <div class="day-title">

            ${
              date === "未设日期"
              ?
              "📅 未设日期"
              :
              formatDate(date)
            }

          </div>

      `;


      groups[date].forEach(item => {

        html += renderItem(
          item,
          "itinerary",
          trip
        );

      });


      html += `</div>`;

    });


  content.innerHTML = html;


  loadAllItineraryFiles(
    trip
  );

}

/* =========================================================
   ★ 加进行程
========================================================= */

function addToItinerary(
  type,
  sourceId
) {

  const trip =
    getCurrentTrip();

  if (!trip) return;


  if (
    type !== "hotel" &&
    type !== "transport" &&
    type !== "places"
  ) {

    return;

  }


  const source =
    (trip[type] || [])
    .find(
      item =>
        String(item.id) ===
        String(sourceId)
    );


  if (!source) {

    alert(
      "找不到这个资料"
    );

    return;

  }


  /* =========================
     检查是否已经加入
  ========================= */

  const alreadyExists =
    (trip.itinerary || [])
    .some(
      item =>
        item.sourceType === type &&
        String(item.sourceId) ===
        String(source.id)
    );


  if (alreadyExists) {

    return;

  }


  /* =========================
     建立新的行程项目
  ========================= */

  const itineraryItem = {

    id:
      createId(),

    date:
      source.date ||
      trip.startDate ||
      "",

    time:
      source.time ||
      "",

    icon:
      getIcon(type),

    name:
      source.name ||
      "",

    place:
      source.place ||
      "",

    member:
      source.member ||
      "",

    note:
      source.note ||
      "",

    link:
      source.link ||
      "",

    map:
      source.map ||
      "",

    sourceType:
      type,

    sourceId:
      source.id

  };


  trip.itinerary.push(
    itineraryItem
  );


  saveTrips();


  /*
     留在目前页面，
     这样可以继续把其他酒店、
     交通、美食景点加入行程。
     按钮会变成「✅ 已在行程」。
  */

  renderTrip();

}


/* =========================================================
   费用页面
========================================================= */

function renderExpense(
  content,
  trip
) {

  if (!trip.expense) {

    trip.expense = [];

  }


  const totals = {};


  trip.expense.forEach(
    item => {

      const currency =
        (
          item.currency ||
          "SGD"
        )
        .trim()
        .toUpperCase();


      if (!totals[currency]) {

        totals[currency] = 0;

      }


      totals[currency] +=
        Number(
          item.amount || 0
        );

    }
  );


  let html = `

    <div class="section-header">

      <h2>
        💰 费用
      </h2>

    </div>


    <div class="expense-hint">

      💡 费用可以直接在「📅 行程」
      里面添加

    </div>


    <div class="total-card">

      <div class="total-label">

        Trip 总费用

      </div>


      <div class="total-money">

        ${
          Object.keys(totals).length
          ?
          Object.keys(totals)
            .sort()
            .map(currency => `

              <div class="total-currency">

                ${formatMoney(
                  totals[currency],
                  currency
                )}

              </div>

            `)
            .join("")
          :
          `<div>—</div>`
        }

      </div>

    </div>

  `;


  if (!trip.expense.length) {

    html += `

      <div class="empty">

        还没有费用记录

        <br><br>

        去「📅 行程」
        添加费用吧 💰

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  const expenses =
    [...trip.expense]
    .sort(
      (a,b) =>
        (a.date || "")
        .localeCompare(
          b.date || ""
        )
    );


  expenses.forEach(item => {

    html += renderExpenseCard(
      item,
      trip
    );

  });


  content.innerHTML = html;

}


/* =========================================================
   Currency
========================================================= */

function formatMoney(
  amount,
  currency
) {

  const code =
    (
      currency ||
      "SGD"
    )
    .trim()
    .toUpperCase();


  const number =
    Number(amount || 0);


  const fixed =
    (
      code === "JPY" ||
      code === "KRW"
    )
    ?
    number.toFixed(0)
    :
    number.toFixed(2);


  const symbols = {

    SGD:
      "S$",

    HKD:
      "HK$",

    CNY:
      "¥",

    RMB:
      "¥",

    MYR:
      "RM",

    JPY:
      "¥",

    USD:
      "US$",

    EUR:
      "€",

    GBP:
      "£",

    KRW:
      "₩",

    TWD:
      "NT$",

    THB:
      "฿",

    AUD:
      "A$",

    CAD:
      "C$",

    NZD:
      "NZ$"

  };


  if (
    symbols[code]
  ) {

    return (
      symbols[code] +
      fixed
    );

  }


  return (
    escapeHTML(code) +
    " " +
    fixed
  );

}

/* =========================================================
   加载行程文件
========================================================= */

async function loadAllItineraryFiles(
  trip
) {

  for (
    const item of
    trip.itinerary || []
  ) {

    try {

      const files =
        await getFilesForItinerary(
          item.id
        );


      renderItineraryFiles(
        item.id,
        files
      );

    }
    catch(error) {

      console.error(
        "读取文件失败",
        error
      );

    }

  }

}


function renderItineraryFiles(
  itineraryId,
  files
) {

  const container =
    document.getElementById(
      `files-${itineraryId}`
    );

  if (!container) return;


  if (!files.length) {

    container.innerHTML = "";

    return;

  }


  container.innerHTML =
    files.map(file => `

      <div class="file-card">

        <div class="file-info">

          <div class="file-name">

            📎
            ${escapeHTML(
              file.name
            )}

          </div>

          <div class="file-size">

            ${formatFileSize(
              file.size
            )}

          </div>

        </div>


        <div class="file-actions">

          <button
            class="file-open-button"
            onclick="
              openStoredFile(
                '${escapeHTML(file.id)}'
              )
            ">

            查看

          </button>


          <button
            class="file-delete-button"
            onclick="
              deleteStoredFile(
                '${escapeHTML(file.id)}',
                ${itineraryId}
              )
            ">

            删除

          </button>

        </div>

      </div>

    `)
    .join("");

}


/* =========================================================
   上传行程文件
========================================================= */

async function uploadItineraryFiles(
  itineraryId,
  fileList
) {

  if (!fileList || !fileList.length) {
    return;
  }


  try {

    for (
      const file of
      Array.from(fileList)
    ) {

      await saveFileToDB(
        file,
        itineraryId
      );

    }


    const files =
      await getFilesForItinerary(
        itineraryId
      );


    renderItineraryFiles(
      itineraryId,
      files
    );


    alert(
      "文件上传成功 📎"
    );

  }
  catch(error) {

    console.error(
      error
    );

    alert(
      "文件上传失败，请再试一次"
    );

  }

}


/* =========================================================
   打开文件
========================================================= */

async function openStoredFile(
  fileId
) {

  try {

    const file =
      await getFileById(
        fileId
      );


    if (!file) {

      alert(
        "找不到这个文件"
      );

      return;

    }


    const url =
      URL.createObjectURL(
        file.blob
      );


    window.open(
      url,
      "_blank"
    );


    setTimeout(
      () => {

        URL.revokeObjectURL(
          url
        );

      },
      60000
    );

  }
  catch(error) {

    console.error(
      error
    );

    alert(
      "无法打开文件"
    );

  }

}


/* =========================================================
   删除文件
========================================================= */

async function deleteStoredFile(
  fileId,
  itineraryId
) {

  if (
    !confirm(
      "确定要删除这个文件吗？"
    )
  ) {

    return;

  }


  try {

    await deleteFileFromDB(
      fileId
    );


    const files =
      await getFilesForItinerary(
        itineraryId
      );


    renderItineraryFiles(
      itineraryId,
      files
    );

  }
  catch(error) {

    console.error(
      error
    );

    alert(
      "删除文件失败"
    );

  }

}

/* =========================================================
   Save Trip
========================================================= */

function saveTrip() {

  const name =
    document.getElementById(
      "tripName"
    ).value.trim();


  const startDate =
    document.getElementById(
      "tripStart"
    ).value;


  const endDate =
    document.getElementById(
      "tripEnd"
    ).value;


  const members =
    [
      ...document.querySelectorAll(
        ".trip-member:checked"
      )
    ]
    .map(
      input =>
        input.value
    );


  if (!name) {

    alert(
      "请输入 Trip 名称"
    );

    return;

  }


  if (
    !startDate ||
    !endDate
  ) {

    alert(
      "请选择 Trip 日期"
    );

    return;

  }


  if (
    !members.length
  ) {

    alert(
      "至少选择一位成员"
    );

    return;

  }


  if (editingId) {

    const trip =
      trips.find(
        item =>
          item.id ===
          editingId
      );


    trip.name =
      name;

    trip.startDate =
      startDate;

    trip.endDate =
      endDate;

    trip.members =
      members;

  }


  else {

    const newTrip = {

      id:
        createId(),

      name,

      startDate,

      endDate,

      members,

      itinerary: [],

      hotel: [],

      transport: [],

      places: [],

      expense: []

    };


    trips.push(
      newTrip
    );

  }


  saveTrips();

  closeModal();

  renderHome();

}


/* =========================================================
   Delete Trip
========================================================= */

async function deleteTrip(id) {

  const trip =
    trips.find(
      item =>
        item.id === id
    );


  if (!trip) return;


  if (
    !confirm(
      `确定要删除「${trip.name}」吗？`
    )
  ) {

    return;

  }


  /* =========================
     删除这个 Trip 的行程文件
  ========================= */

  try {

    for (
      const itineraryItem of
      trip.itinerary || []
    ) {

      const files =
        await getFilesForItinerary(
          itineraryItem.id
        );


      for (
        const file of files
      ) {

        await deleteFileFromDB(
          file.id
        );

      }

    }

  }
  catch(error) {

    console.error(
      "清理文件失败",
      error
    );

  }


  trips =
    trips.filter(
      item =>
        item.id !== id
    );


  saveTrips();

  renderHome();

}

/* =========================================================
   Save Item
========================================================= */

function saveItem() {

  const trip =
    getCurrentTrip();


  if (!trip) return;


  const type =
    editingType;


  let item;


  /* =========================
     行程
  ========================= */

  if (
    type === "itinerary"
  ) {

    const oldItem =
      editingId
      ?
      trip.itinerary.find(
        x =>
          x.id ===
          editingId
      )
      :
      null;


    item = {

      id:
        editingId ||
        createId(),

      date:
        document.getElementById(
          "fDate"
        ).value,

      time:
        document.getElementById(
          "fTime"
        ).value,

      icon:
        document.getElementById(
          "fIcon"
        ).value ||
        getIcon(type),

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      place:
        document.getElementById(
          "fPlace"
        ).value.trim(),

      member:
        document.getElementById(
          "fMember"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim(),

      link:
        document.getElementById(
          "fLink"
        ).value.trim(),

      map:
        document.getElementById(
          "fMap"
        ).value.trim()

    };


    /*
       如果原本是从酒店/交通/景点复制来的，
       编辑时继续保留 source 信息，
       这样「已在行程」状态不会消失。
    */

    if (oldItem) {

      if (
        oldItem.sourceType
      ) {

        item.sourceType =
          oldItem.sourceType;

      }

      if (
        oldItem.sourceId !==
        undefined
      ) {

        item.sourceId =
          oldItem.sourceId;

      }

    }

  }


  /* =========================
     酒店 / 交通 / 景点
  ========================= */

  else if (
    type === "hotel" ||
    type === "transport" ||
    type === "places"
  ) {

    item = {

      id:
        editingId ||
        createId(),

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      place:
        document.getElementById(
          "fPlace"
        ).value.trim(),

      date:
        document.getElementById(
          "fDate"
        ).value,

      time:
        document.getElementById(
          "fTime"
        ).value,

      member:
        document.getElementById(
          "fMember"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim(),

      link:
        document.getElementById(
          "fLink"
        ).value.trim(),

      map:
        document.getElementById(
          "fMap"
        ).value.trim()

    };

  }


  /* =========================
     费用
  ========================= */

  else if (
    type === "expense"
  ) {

    const participants =
      [
        ...document.querySelectorAll(
          ".expense-participant:checked"
        )
      ]
      .map(
        input =>
          input.value
      );


    const oldExpense =
      editingId
      ?
      trip.expense.find(
        x =>
          x.id ===
          editingId
      )
      :
      null;


    const currency =
      (
        document.getElementById(
          "fCurrency"
        ).value.trim() ||
        "SGD"
      )
      .toUpperCase();


    item = {

      id:
        editingId ||
        createId(),

      itineraryId:
        editingId
        ?
        (
          oldExpense?.itineraryId ||
          null
        )
        :
        expenseItineraryId,

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      amount:
        Number(
          document.getElementById(
            "fAmount"
          ).value
        ) || 0,

      currency,

      payer:
        document.getElementById(
          "fPayer"
        ).value,

      participants,

      date:
        document.getElementById(
          "fDate"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim()

    };

  }


  if (!item.name) {

    alert(
      "请输入名称"
    );

    return;

  }


  if (
    type === "expense" &&
    item.amount <= 0
  ) {

    alert(
      "请输入费用金额"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.currency
  ) {

    alert(
      "请输入 Currency"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.payer
  ) {

    alert(
      "请选择谁付款"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.participants.length
  ) {

    alert(
      "请选择至少一位分摊成员"
    );

    return;

  }


  if (editingId) {

    const index =
      trip[type].findIndex(
        x =>
          x.id ===
          editingId
      );


    if (index !== -1) {

      trip[type][index] =
        item;

    }

  }


  else {

    trip[type].push(
      item
    );

  }


  saveTrips();

  closeModal();

  renderTrip();

}


/* =========================================================
   Delete Item
========================================================= */

async function deleteItem(
  type,
  id
) {

  const trip =
    getCurrentTrip();


  if (!trip) return;


  if (
    !confirm(
      "确定要删除这个项目吗？"
    )
  ) {

    return;

  }


  /*
     如果删除的是行程，
     同时清理它的上传文件。
  */

  if (
    type === "itinerary"
  ) {

    try {

      const files =
        await getFilesForItinerary(
          id
        );


      for (
        const file of files
      ) {

        await deleteFileFromDB(
          file.id
        );

      }

    }
    catch(error) {

      console.error(
        "清理行程文件失败",
        error
      );

    }

  }


  trip[type] =
    trip[type].filter(
      item =>
        item.id !== id
    );


  saveTrips();

  renderTrip();

}


/* =========================================================
   Close Modal
========================================================= */

function closeModal() {

  document.getElementById(
    "modalOverlay"
  )
  .classList
  .remove("show");


  editingId = null;

  editingType = null;

  expenseItineraryId = null;

}


/* =========================================================
   Back Home
========================================================= */

function backHome() {

  currentTripId = null;

  placesSearchKeyword = "";

  renderHome();

}


/* =========================================================
   点击背景关闭
========================================================= */

document
  .getElementById(
    "modalOverlay"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );


/* =========================================================
   初始显示
========================================================= */

renderHome();


</script>
