<script>

/* =========================================================
   成员
========================================================= */

const MEMBERS = [
  "Lynn",
  "Vincent",
  "Esther",
  "Tong"
];  
/* =========================================================
   ☁️ Supabase 云端共享
========================================================= */

const SUPABASE_URL =
  "https://erszppdihousdwgoavgd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VrTQJJscjZjC28622CVGIg_Hq7vY5n4";

const SUPABASE_TABLE =
  "trips";

let cloudReady = false;
let cloudSyncing = false;
let lastCloudSnapshot = "";

function getSupabaseHeaders() {

  return {
    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " +
      SUPABASE_KEY,

    "Content-Type":
      "application/json"
  };

}


/* =========================================================
   把本地 Trip 转成 Supabase 格式
========================================================= */

function tripToCloud(trip) {

  return {

    id:
      trip.id,

    name:
      trip.name || "",

    start_date:
      trip.startDate || null,

    end_date:
      trip.endDate || null,

    members:
      trip.members || [],

    itinerary:
      trip.itinerary || [],

    hotel:
      trip.hotel || [],

    transport:
      trip.transport || [],

    places:
      trip.places || [],

    expense:
      trip.expense || []

  };

}


/* =========================================================
   Supabase → App 格式
========================================================= */

function cloudToTrip(row) {

  return {

    id:
      row.id,

    name:
      row.name || "",

    startDate:
      row.start_date || "",

    endDate:
      row.end_date || "",

    members:
      row.members || [],

    itinerary:
      row.itinerary || [],

    hotel:
      row.hotel || [],

    transport:
      row.transport || [],

    places:
      row.places || [],

    expense:
      row.expense || []

  };

}


/* =========================================================
   上传一个 Trip
========================================================= */

async function uploadTripToCloud(trip) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        SUPABASE_TABLE +
        "?on_conflict=id",
        {

          method: "POST",

          headers: {

            ...getSupabaseHeaders(),

            "Prefer":
              "resolution=merge-duplicates,return=minimal"

          },

          body:
            JSON.stringify(
              tripToCloud(trip)
            )

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Supabase 保存失败：",
        errorText
      );

      return false;

    }


    return true;

  }
  catch(error) {

    console.error(
      "Supabase 连接失败：",
      error
    );

    return false;

  }

}


/* =========================================================
   删除云端 Trip
========================================================= */

async function deleteTripFromCloud(id) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        SUPABASE_TABLE +
        "?id=eq." +
        encodeURIComponent(id),
        {

          method: "DELETE",

          headers:
            getSupabaseHeaders()

        }
      );


    if (!response.ok) {

      console.error(
        "Supabase 删除失败",
        await response.text()
      );

      return false;

    }


    return true;

  }
  catch(error) {

    console.error(
      "Supabase 删除连接失败：",
      error
    );

    return false;

  }

}


/* =========================================================
   读取全部 Trips
========================================================= */

async function loadTripsFromCloud() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        SUPABASE_TABLE +
        "?select=*",
        {

          method: "GET",

          headers:
            getSupabaseHeaders()

        }
      );


    if (!response.ok) {

      console.error(
        "Supabase 读取失败：",
        await response.text()
      );

      return null;

    }


    const rows =
      await response.json();


    return rows.map(
      cloudToTrip
    );

  }
  catch(error) {

    console.error(
      "Supabase 读取连接失败：",
      error
    );

    return null;

  }

}


/* =========================================================
   第一次启动云端同步
========================================================= */

async function initCloudSync() {

  if (cloudReady) {
    return;
  }


  const cloudTrips =
    await loadTripsFromCloud();


  /*
    Supabase 里面已经有资料
    → 以云端资料为准
  */

  if (
    cloudTrips &&
    cloudTrips.length
  ) {

    trips =
      cloudTrips;


    localStorage.setItem(
      "travelTrips",
      JSON.stringify(trips)
    );


    lastCloudSnapshot =
      JSON.stringify(trips);


    cloudReady = true;


    if (
      currentTripId !== null
    ) {

      renderTrip();

    }
    else {

      renderHome();

    }

  }


  /*
    Supabase 是空的
    → 把现在手机里的资料上传上去
  */

  else if (
    cloudTrips &&
    !cloudTrips.length
  ) {

    for (
      const trip of trips
    ) {

      await uploadTripToCloud(
        trip
      );

    }


    lastCloudSnapshot =
      JSON.stringify(trips);


    cloudReady = true;

  }


  /*
    网络失败
    → 暂时继续使用 localStorage
  */

  else {

    console.warn(
      "暂时无法连接 Supabase，继续使用本地资料"
    );

    cloudReady = true;

  }


  startCloudPolling();

}


/* =========================================================
   本地资料 → 云端
========================================================= */

async function syncTripsToCloud() {

  if (
    !cloudReady ||
    cloudSyncing
  ) {

    return;

  }


  cloudSyncing = true;


  try {

    for (
      const trip of trips
    ) {

      await uploadTripToCloud(
        trip
      );

    }


    lastCloudSnapshot =
      JSON.stringify(trips);

  }
  finally {

    cloudSyncing = false;

  }

}


/* =========================================================
   云端自动检查
   每 5 秒检查一次
========================================================= */

let cloudPollingStarted =
  false;


function startCloudPolling() {

  if (
    cloudPollingStarted
  ) {

    return;

  }


  cloudPollingStarted =
    true;


  setInterval(
    syncFromCloud,
    5000
  );

}


/* =========================================================
   云端 → 当前页面
========================================================= */

async function syncFromCloud() {

  if (
    !cloudReady ||
    cloudSyncing
  ) {

    return;

  }


  /*
    正在编辑 Modal 时不要强行刷新
    避免把用户正在输入的资料弄掉
  */

  const modal =
    document.getElementById(
      "modalOverlay"
    );


  if (
    modal &&
    modal.classList.contains(
      "show"
    )
  ) {

    return;

  }


  const cloudTrips =
    await loadTripsFromCloud();


  if (
    !cloudTrips
  ) {

    return;

  }


  const snapshot =
    JSON.stringify(
      cloudTrips
    );


  if (
    snapshot ===
    lastCloudSnapshot
  ) {

    return;

  }


  /*
    云端有变化
    → 更新本地
  */

  trips =
    cloudTrips;


  localStorage.setItem(
    "travelTrips",
    JSON.stringify(trips)
  );


  lastCloudSnapshot =
    snapshot;


  /*
    保留目前打开的 Trip
  */

  if (
    currentTripId !== null &&
    trips.some(
      trip =>
        String(trip.id) ===
        String(currentTripId)
    )
  ) {

    renderTrip();

  }
  else {

    currentTripId =
      null;

    renderHome();

  }

}

/* =========================================================
   IndexedDB
========================================================= */

const FILE_DB_NAME =
  "travelAppFiles";

const FILE_DB_VERSION = 1;

const FILE_STORE =
  "files";


function openFileDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          FILE_DB_NAME,
          FILE_DB_VERSION
        );

      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames.contains(
              FILE_STORE
            )
          ) {

            db.createObjectStore(
              FILE_STORE,
              {
                keyPath: "id"
              }
            );

          }

        };

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function saveFileToDB(
  file,
  itineraryId
) {

  const db =
    await openFileDB();

  const id =
    "file_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const record = {

        id,

        itineraryId,

        name:
          file.name,

        type:
          file.type ||
          "application/octet-stream",

        size:
          file.size,

        createdAt:
          new Date().toISOString(),

        blob:
          file

      };

      const request =
        store.put(record);

      request.onsuccess =
        function() {

          resolve(record);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


async function getFilesForItinerary(
  itineraryId
) {

  const db =
    await openFileDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          FILE_STORE,
          "readonly"
        );

      const store =
        transaction.objectStore(
          FILE_STORE
        );

      const request =
        store.getAll();

      request.onsuccess =
        function() {

          const result =
            request.result
            .filter(
              item =>
                String(
                  item.itineraryId
                ) ===
                String(
                  itineraryId
                )
            )
            .sort(
              (a,b) =>
                (
                  a.createdAt || ""
                )
                .localeCompare(
                  b.createdAt || ""
                )
            );

          resolve(result);

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}

/* =========================================================
   Escape
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   日期
========================================================= */

function formatDate(dateString) {

  if (!dateString) return "";

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  return date.toLocaleDateString(
    "zh-CN",
    {
      month: "long",
      day: "numeric",
      weekday: "short"
    }
  );

}


function formatDateRange(
  start,
  end
) {

  if (!start && !end) {
    return "";
  }

  if (
    start &&
    end
  ) {

    return `
      ${formatDate(start)}
      →
      ${formatDate(end)}
    `;

  }

  return formatDate(
    start || end
  );

}


/* =========================================================
   文件大小
========================================================= */

function formatFileSize(size) {

  if (!size) return "0 KB";

  if (
    size < 1024
  ) {

    return size + " B";

  }

  if (
    size < 1024 * 1024
  ) {

    return (
      (size / 1024)
      .toFixed(1)
    ) +
    " KB";

  }

  return (
    (size /
      1024 /
      1024)
      .toFixed(1)
  ) +
  " MB";

}

/* =========================================================
   行程
========================================================= */

function renderItinerary(
  content,
  trip
) {

  const items =
    [...(trip.itinerary || [])]
    .sort(
      (a,b) =>
        (
          (a.date || "") +
          (a.time || "")
        )
        .localeCompare(
          (b.date || "") +
          (b.time || "")
        )
    );


  let html = `

    <div class="section-header">

      <h2>
        📅 每日行程
      </h2>


      <button
        class="add-button"
        onclick="
          openModal('itinerary')
        ">

        ＋ 添加

      </button>

    </div>

  `;


  if (!items.length) {

    html += `

      <div class="empty">

        还没有行程

        <br><br>

        按「＋ 添加」
        开始吧 ✨

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  const groups = {};


  items.forEach(item => {

    const date =
      item.date ||
      "未设日期";

    if (!groups[date]) {
      groups[date] = [];
    }

    groups[date].push(item);

  });


  Object.keys(groups)
    .sort()
    .forEach(date => {

      html += `

        <div class="day">

          <div class="day-title">

            ${
              date === "未设日期"
              ?
              "📅 未设日期"
              :
              formatDate(date)
            }

          </div>

      `;


      groups[date].forEach(item => {

        html += renderItem(
          item,
          "itinerary",
          trip
        );

      });


      html += `</div>`;

    });


  content.innerHTML = html;

}

          🍜 美食

        </button>


        <button
          class="category-button ${
            placesCategoryFilter === "scenic"
            ? "active"
            : ""
          }"
          onclick="
            setPlacesCategory('scenic')
          ">

          🏞️ 景点

        </button>

      </div>

    `;

  }


  let items =
    [...(trip[type] || [])];


  /*
    美食景点分类
  */

  if (
    type === "places"
  ) {

    items =
      items.filter(item => {

        /*
          旧资料没有 category
          自动视为 food
        */

        const category =
          item.category ||
          "food";


        return (
          placesCategoryFilter === "all" ||
          category === placesCategoryFilter
        );

      });

  }


  /*
    搜索
  */

  if (
    type === "places" &&
    placesSearchKeyword.trim()
  ) {

    const keyword =
      placesSearchKeyword
        .trim()
        .toLowerCase();


    items =
      items.filter(item => {

        const text = [

          item.name || "",
          item.place || "",
          item.note || "",
          item.member || "",
          item.date || "",
          item.time || "",
          item.category === "scenic"
            ? "景点"
            : "美食"

        ]
        .join(" ")
        .toLowerCase();


        return text.includes(
          keyword
        );

      });

  }


  if (!items.length) {

    html += `

      <div class="empty">

        ${
          type === "places" &&
          placesSearchKeyword.trim()
          ?
          "找不到符合的资料"
          :
          type === "places" &&
          placesCategoryFilter === "food"
          ?
          "还没有美食资料"
          :
          type === "places" &&
          placesCategoryFilter === "scenic"
          ?
          "还没有景点资料"
          :
          "还没有资料"
        }

        ${
          !(
            type === "places" &&
            placesSearchKeyword.trim()
          )
          ?
          `
            <br><br>

            按「＋ 添加」
            开始吧 ✨
          `
          :
          ""
        }

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  items.forEach(item => {

    html += renderItem(
      item,
      type,
      trip
    );

  });


  content.innerHTML = html;

}

/* =========================================================
   加进行程
========================================================= */

function addToItinerary(
  type,
  sourceId
) {

  const trip =
    getCurrentTrip();

  if (!trip) return;


  if (
    type !== "hotel" &&
    type !== "transport" &&
    type !== "places"
  ) {

    return;

  }


  const source =
    (trip[type] || [])
    .find(
      item =>
        String(item.id) ===
        String(sourceId)
    );


  if (!source) {

    alert(
      "找不到这个资料"
    );

    return;

  }


  const alreadyExists =
    (trip.itinerary || [])
    .some(
      item =>
        item.sourceType === type &&
        String(item.sourceId) ===
        String(source.id)
    );


  if (alreadyExists) {

    return;

  }


  let itineraryItem = {

    id:
      createId(),

    date:
      trip.startDate || "",

    time:
      "",

    endDate:
      "",

    endTime:
      "",

    icon:
      type === "places"
      ?
      getPlaceIcon(source)
      :
      (
        source.icon ||
        getIcon(type)
      ),

    name:
      source.name ||
      "",

    place:
      source.place ||
      "",

    member:
      source.member ||
      "",

    note:
      source.note ||
      "",

    link:
      "",

    map:
      source.map ||
      "",

    sourceType:
      type,

    sourceId:
      source.id

  };


  /* =========================
     酒店 → 行程
  ========================= */

  if (
    type === "hotel"
  ) {

    itineraryItem.date =
      source.startDate ||
      source.checkIn ||
      source.date ||
      trip.startDate ||
      "";

    itineraryItem.endDate =
      source.endDate ||
      source.checkOut ||
      "";

    itineraryItem.time =
      "";

    itineraryItem.endTime =
      "";

  }


  /* =========================
     交通 → 行程
  ========================= */

  else if (
    type === "transport"
  ) {

    itineraryItem.date =
      source.startDate ||
      source.date ||
      trip.startDate ||
      "";

    itineraryItem.time =
      source.startTime ||
      source.departTime ||
      source.time ||
      "";

    itineraryItem.endTime =
      source.endTime ||
      source.arriveTime ||
      "";

    itineraryItem.endDate =
      "";

    itineraryItem.link =
      "";

  }


  /* =========================
     美食 / 景点 → 行程
  ========================= */

  else if (
    type === "places"
  ) {

    itineraryItem.date =
      source.date ||
      trip.startDate ||
      "";

    itineraryItem.time =
      source.time ||
      "";

    itineraryItem.endDate =
      "";

    itineraryItem.endTime =
      "";

  }


  trip.itinerary.push(
    itineraryItem
  );


  saveTrips();


  renderTrip();

}

            📎
            ${escapeHTML(
              file.name
            )}

          </div>

          <div class="file-size">

              file.size
            )}

              )

          </button>


          <button
            class="file-delete-button"
            onclick="

                )}',
                ${itineraryId}
              )
            ">

            删除

          </button>

        </div>

      </div>

    `)
    .join("");

}


async function uploadItineraryFiles(
  itineraryId,
  fileList
) {

  if (
    !fileList ||
    !fileList.length
  ) {

    return;

  }


  try {

    for (
      const file of
      Array.from(fileList)
    ) {

      await saveFileToDB(
        file,
        itineraryId
      );

    }


    const files =
      await getFilesForItinerary(
        itineraryId
      );


    renderDetailItineraryFiles(
      itineraryId,
      files
    );


    alert(
      "文件上传成功 📎"
    );

  }
  catch(error) {

    console.error(
      error
    );

    alert(
      "文件上传失败，请再试一次"
    );

  }

}

    才 window.open()，

    iPhone / Safari 很容易把它判断为
    非用户操作，从而拦截弹窗。
  */

  let newWindow = null;

  try {

    newWindow =
      window.open(
        "",
        "_blank"
      );

  }
  catch(error) {

    console.error(
      "无法打开新窗口",
      error
    );

  }


  /*
    如果 Safari 已经拦截，
    先不立即报错。
    后面会尝试备用方式。
  */


  try {

    const file =
      await getFileById(
        fileId
      );


    if (!file) {

      if (newWindow) {
        newWindow.close();
      }

      alert(
        "找不到这个文件"
      );

      return;

    }


    const blob =
      file.blob instanceof Blob
      ?
      file.blob
      :
      new Blob(
        [file.blob],
        {
          type:
            file.type ||
            "application/octet-stream"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    /*
      PDF / 图片 / 浏览器可以直接显示的文件：
      直接把刚才已经打开的页面导航到 Blob URL。
    */

    if (newWindow) {

      try {

        newWindow.location.href =
          url;

        /*
          不要马上 revoke。
          iPhone / Safari 对 Blob URL
          的读取比较敏感。
        */

        setTimeout(
          () => {

            try {

              URL.revokeObjectURL(
                url
              );

            }
            catch(error) {}

          },
          5 * 60 * 1000
        );

        return;

      }
      catch(error) {

        console.error(
          "新窗口打开失败",
          error
        );

      }

    }


    /*
      如果 window.open 被 Safari 拦截，
      尝试使用真正的 <a> 下载/打开方式。
    */

    const link =
      document.createElement(
        "a"
      );

    link.href = url;

    link.target =
      "_blank";

    link.rel =
      "noopener";

    /*
      不设置 download，
      让 PDF / 图片尽可能直接打开。
    */

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();


    setTimeout(
      () => {

        try {

          URL.revokeObjectURL(
            url
          );

        }
        catch(error) {}

      },
      5 * 60 * 1000
    );


  }
  catch(error) {

    console.error(
      "打开文件失败",
      error
    );


    if (newWindow) {

      try {
        newWindow.close();
      }
      catch(closeError) {}

    }


    alert(
      "无法打开文件，请再试一次"
    );

  }

}

/* =========================================================
   Save Trip
========================================================= */

function saveTrip() {

  const name =
    document.getElementById(
      "tripName"
    ).value.trim();


  const startDate =
    document.getElementById(
      "tripStart"
    ).value;


  const endDate =
    document.getElementById(
      "tripEnd"
    ).value;


  const members =
    [
      ...document.querySelectorAll(
        ".trip-member:checked"
      )
    ]
    .map(
      input =>
        input.value
    );


  if (!name) {

    alert(
      "请输入 Trip 名称"
    );

    return;

  }


  if (
    !startDate ||
    !endDate
  ) {

    alert(
      "请选择 Trip 日期"
    );

    return;

  }


  if (
    !members.length
  ) {

    alert(
      "至少选择一位成员"
    );

    return;

  }


  if (editingId) {

    const trip =
      trips.find(
        item =>
          item.id ===
          editingId
      );


    if (!trip) return;


    trip.name =
      name;

    trip.startDate =
      startDate;

    trip.endDate =
      endDate;

    trip.members =
      members;

  }

  else {

    trips.push({

      id:
        createId(),

      name,

      startDate,

      endDate,

      members,

      itinerary: [],

      hotel: [],

      transport: [],

      places: [],

      expense: []

    });

  }


  saveTrips();

  closeModal();

  renderHome();

}


/* =========================================================
   Delete Trip
========================================================= */

async function deleteTrip(id) {

  const trip =
    trips.find(
      item =>
        item.id === id
    );


  if (!trip) return;


  if (
    !confirm(
      `确定要删除「${trip.name}」吗？`
    )
  ) {

    return;

  }


  try {

    for (
      const itineraryItem of
      trip.itinerary || []
    ) {

      const files =
        await getFilesForItinerary(
          itineraryItem.id
        );


      for (
        const file of files
      ) {

        await deleteFileFromDB(
          file.id
        );

      }

    }

  }
  catch(error) {

    console.error(
      "清理文件失败",
      error
    );

  }


  trips =
    trips.filter(
      item =>
        item.id !== id
    );


  saveTrips();

  currentTripId = null;

  renderHome();

}

/* =========================================================
   Delete Item
========================================================= */

async function deleteItem(
  type,
  id
) {

  const trip =
    getCurrentTrip();


  if (!trip) return;


  if (
    !confirm(
      "确定要删除这个项目吗？"
    )
  ) {

    return;

  }


  if (
    type === "itinerary"
  ) {

    try {

      const files =
        await getFilesForItinerary(
          id
        );


      for (
        const file of files
      ) {

        await deleteFileFromDB(
          file.id
        );

      }

    }
    catch(error) {

      console.error(
        "清理行程文件失败",
        error
      );

    }

  }


  trip[type] =
    trip[type].filter(
      item =>
        item.id !== id
    );


  /*
    删除酒店 / 交通 / 美食景点时，
    对应的已加入行程也一起解除 source 关系。
  */

  if (
    type === "hotel" ||
    type === "transport" ||
    type === "places"
  ) {

    trip.itinerary =
      trip.itinerary.filter(
        itineraryItem =>
          !(
            itineraryItem.sourceType === type &&
            String(
              itineraryItem.sourceId
            ) ===
            String(id)
          )
      );

  }


  saveTrips();


  viewingId = null;

  viewingType = null;


  renderTrip();

}

/* =========================================================
   Currency
========================================================= */

function formatMoney(
  amount,
  currency
) {

  const code =
    (
      currency ||
      "SGD"
    )
    .trim()
    .toUpperCase();


  const number =
    Number(amount || 0);


  const fixed =
    (
      code === "JPY" ||
      code === "KRW"
    )
    ?
    number.toFixed(0)
    :
    number.toFixed(2);


  const symbols = {

    SGD: "S$",
    HKD: "HK$",
    CNY: "¥",
    RMB: "¥",
    MYR: "RM",
    JPY: "¥",
    USD: "US$",
    EUR: "€",
    GBP: "£",
    KRW: "₩",
    TWD: "NT$",
    THB: "฿",
    AUD: "A$",
    CAD: "C$",
    NZD: "NZ$"

  };


  if (
    symbols[code]
  ) {

    return (
      symbols[code] +
      fixed
    );

  }


  return (
    escapeHTML(code) +
    " " +
    fixed
  );

}

   ★ 日期 / 时间双向联动 + 费用联动修正版
   ========================================================= */

let isDateTimeSyncing = false;


/* =========================================================
   找到来源对应的行程
   ========================================================= */

function findLinkedItinerary(
  trip,
  type,
  sourceId
) {

  return (
    trip.itinerary || []
  ).find(
    itinerary =>
      itinerary.sourceType === type &&
      String(itinerary.sourceId) ===
      String(sourceId)
  );

}


/* =========================================================
   同步某个行程的费用日期
   费用金额、币种、付款人、分摊人员、备注
   全部不会改变
   ========================================================= */

function syncExpensesForItinerary(
  trip,
  itineraryId
) {

  if (!trip.expense) {
    trip.expense = [];
  }

  const itinerary =
    (trip.itinerary || []).find(
      item =>
        String(item.id) ===
        String(itineraryId)
    );

  if (!itinerary) {
    return;
  }

  trip.expense.forEach(
    expense => {

      if (
        expense.itineraryId != null &&
        String(expense.itineraryId) ===
        String(itineraryId)
      ) {

        expense.date =
          itinerary.date || "";

      }

    }
  );

}


/* =========================================================
   行程 → 酒店 / 交通 / 美食景点
   只同步日期 / 时间
   ========================================================= */

function syncSourceFromItinerary(
  trip,
  itinerary
) {

  if (
    !itinerary ||
    !itinerary.sourceType ||
    itinerary.sourceId == null
  ) {
    return;
  }

  const type =
    itinerary.sourceType;

  if (
    type !== "hotel" &&
    type !== "transport" &&
    type !== "places"
  ) {
    return;
  }

  const source =
    (trip[type] || []).find(
      item =>
        String(item.id) ===
        String(itinerary.sourceId)
    );

  if (!source) {
    return;
  }

  if (isDateTimeSyncing) {
    return;
  }

  isDateTimeSyncing = true;

  try {

    /* =========================
       酒店
       行程日期 → 入住日期
       行程结束日期 → 退房日期
       ========================= */

    if (
      type === "hotel"
    ) {

      source.startDate =
        itinerary.date || "";

      source.endDate =
        itinerary.endDate || "";

    }


    /* =========================
       交通
       行程日期 → 出发日期
       行程时间 → 出发时间
       行程结束时间 → 到达时间
       ========================= */

    else if (
      type === "transport"
    ) {

      source.startDate =
        itinerary.date || "";

      source.startTime =
        itinerary.time || "";

      source.endTime =
        itinerary.endTime || "";

      /*
        保留旧版 date / time 字段兼容
      */

      source.date =
        source.startDate;

      source.time =
        source.startTime;

    }


    /* =========================
       美食 / 景点
       行程日期 → 日期
       行程时间 → 时间
       ========================= */

    else if (
      type === "places"
    ) {

      source.date =
        itinerary.date || "";

      source.time =
        itinerary.time || "";

    }

  }
  finally {

    isDateTimeSyncing = false;

  }


  /*
    行程日期改变后，
    所有关联费用日期一起改变
  */

  syncExpensesForItinerary(
    trip,
    itinerary.id
  );

}


/* =========================================================
   酒店 / 交通 / 美食景点
   → 行程
   只同步日期 / 时间
   ========================================================= */

function syncItineraryFromSource(
  trip,
  type,
  source
) {

  if (
    !source ||
    (
      type !== "hotel" &&
      type !== "transport" &&
      type !== "places"
    )
  ) {
    return;
  }

  const itinerary =
    findLinkedItinerary(
      trip,
      type,
      source.id
    );

  if (!itinerary) {
    return;
  }

  if (isDateTimeSyncing) {
    return;
  }

  isDateTimeSyncing = true;

  try {

    /* =========================
       酒店 → 行程
       ========================= */

    if (
      type === "hotel"
    ) {

      itinerary.date =
        source.startDate || "";

      itinerary.endDate =
        source.endDate || "";

      /*
        酒店没有时间，
        所以不要碰 itinerary.time
        和 itinerary.endTime
      */

    }


    /* =========================
       交通 → 行程
       ========================= */

    else if (
      type === "transport"
    ) {

      itinerary.date =
        source.startDate ||
        source.date ||
        "";

      itinerary.time =
        source.startTime ||
        source.departTime ||
        source.time ||
        "";

      itinerary.endTime =
        source.endTime ||
        source.arriveTime ||
        "";

      /*
        交通没有结束日期，
        所以不要清除 itinerary.endDate
      */

    }


    /* =========================
       美食 / 景点 → 行程
       ========================= */

    else if (
      type === "places"
    ) {

      itinerary.date =
        source.date || "";

      itinerary.time =
        source.time || "";

      /*
        美食景点没有结束日期 / 结束时间，
        所以不要清除 itinerary.endDate
        和 itinerary.endTime
      */

    }

  }
  finally {

    isDateTimeSyncing = false;

  }


  /*
    行程日期跟着改变后，
    关联费用也跟着改变
  */

  syncExpensesForItinerary(
    trip,
    itinerary.id
  );

}


/* =========================================================
   初始化旧资料
   如果以前已经有「加入行程」的资料，
   自动建立正确的日期 / 时间关系
   ========================================================= */

function syncAllExistingLinks() {

  trips.forEach(
    trip => {

      if (!trip.itinerary) {
        trip.itinerary = [];
      }

      if (!trip.expense) {
        trip.expense = [];
      }

      trip.itinerary.forEach(
        itinerary => {

          if (
            itinerary.sourceType &&
            itinerary.sourceId != null
          ) {

            /*
              以目前行程资料作为第一次同步的基准
            */

            syncSourceFromItinerary(
              trip,
              itinerary
            );

          }

          /*
            无论有没有 source，
            只要费用属于这个行程，
            日期都跟行程一致
          */

          syncExpensesForItinerary(
            trip,
            itinerary.id
          );

        }
      );

    }
  );

}

      id:
        editingId ||
        createId(),

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      place:
        document.getElementById(
          "fPlace"
        ).value.trim(),

      startDate:
        document.getElementById(
          "fStartDate"
        ).value,

      startTime:
        document.getElementById(
          "fStartTime"
        ).value,

      endTime:
        document.getElementById(
          "fEndTime"
        ).value,

      member:
        document.getElementById(
          "fMember"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim(),

      map:
        document.getElementById(
          "fMap"
        ).value.trim(),

      link:
        ""

    };

    /*
      保留旧版字段
    */

    item.date =
      item.startDate;

    item.time =
      item.startTime;

  }


  /* =====================================================
     美食 / 景点
     ===================================================== */

  else if (
    type === "places"
  ) {

    item = {

      id:
        editingId ||
        createId(),

      category:
        document.getElementById(
          "fCategory"
        ).value ||
        "food",

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      place:
        document.getElementById(
          "fPlace"
        ).value.trim(),

      date:
        document.getElementById(
          "fDate"
        ).value,

      time:
        document.getElementById(
          "fTime"
        ).value,

      member:
        document.getElementById(
          "fMember"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim(),

      link:
        document.getElementById(
          "fLink"
        ).value.trim(),

      map:
        document.getElementById(
          "fMap"
        ).value.trim()

    };

  }


  /* =====================================================
     费用
     ===================================================== */

  else if (
    type === "expense"
  ) {

    const participants =
      [
        ...document.querySelectorAll(
          ".expense-participant:checked"
        )
      ]
      .map(
        input =>
          input.value
      );


    const oldExpense =
      editingId
      ?
      trip.expense.find(
        x =>
          String(x.id) ===
          String(editingId)
      )
      :
      null;


    const currency =
      (
        document.getElementById(
          "fCurrency"
        ).value.trim() ||
        "SGD"
      )
      .toUpperCase();


    /*
      保留原来的 itineraryId
    */

    const linkedItineraryId =
      editingId
      ?
      (
        oldExpense?.itineraryId ||
        null
      )
      :
      expenseItineraryId;


    /*
      ★ 如果费用属于某个行程，
      日期永远使用行程日期
    */

    let expenseDate =
      document.getElementById(
        "fDate"
      ).value;


    if (
      linkedItineraryId != null
    ) {

      const linkedItinerary =
        trip.itinerary.find(
          itinerary =>
            String(itinerary.id) ===
            String(linkedItineraryId)
        );

      if (linkedItinerary) {

        expenseDate =
          linkedItinerary.date || "";

      }

    }


    item = {

      id:
        editingId ||
        createId(),

      itineraryId:
        linkedItineraryId,

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      amount:
        Number(
          document.getElementById(
            "fAmount"
          ).value
        ) || 0,

      currency,

      payer:
        document.getElementById(
          "fPayer"
        ).value,

      participants,

      date:
        expenseDate,

      note:
        document.getElementById(
          "fNote"
        ).value.trim()

    };

  }


  /* =====================================================
     基本检查
     ===================================================== */

  if (
    !item ||
    !item.name
  ) {

    alert(
      "请输入名称"
    );

    return;

  }


  if (
    type === "expense" &&
    item.amount <= 0
  ) {

    alert(
      "请输入费用金额"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.payer
  ) {

    alert(
      "请选择谁付款"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.participants.length
  ) {

    alert(
      "请选择至少一位分摊成员"
    );

    return;

  }


  /* =====================================================
     保存
     ===================================================== */

  if (
    editingId
  ) {

    const index =
      trip[type].findIndex(
        x =>
          String(x.id) ===
          String(editingId)
      );

    if (
      index !== -1
    ) {

      trip[type][index] =
        item;

    }

  }
  else {

    trip[type].push(
      item
    );

  }


  /* =====================================================
     ★ 保存后进行双向同步
     ===================================================== */

  if (
    type === "itinerary"
  ) {

    /*
      行程 → 酒店 / 交通 / 美食景点
    */

    syncSourceFromItinerary(
      trip,
      item
    );

    /*
      行程 → 费用
    */

    syncExpensesForItinerary(
      trip,
      item.id
    );

  }


  else if (
    type === "hotel" ||
    type === "transport" ||
    type === "places"
  ) {

    /*
      酒店 / 交通 / 美食景点
      → 行程
    */

    syncItineraryFromSource(
      trip,
      type,
      item
    );

  }


  else if (
    type === "expense"
  ) {

    /*
      如果费用有对应行程，
      再确保日期正确
    */

    if (
      item.itineraryId != null
    ) {

      syncExpensesForItinerary(
        trip,
        item.itineraryId
      );

    }

  }


  saveTrips();

  closeModal();

  renderTrip();

}


/* =========================================================
   ★ 覆盖原本 deleteItem()
   ========================================================= */

async function deleteItem(
  type,
  id
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  if (
    !confirm(
      "确定要删除这个项目吗？"
    )
  ) {

    return;

  }


  /* =====================================================
     删除费用
     ===================================================== */

  if (
    type === "expense"
  ) {

    trip.expense =
      trip.expense.filter(
        item =>
          String(item.id) !==
          String(id)
      );

  }


  /* =====================================================
     删除行程
     → 删除关联费用
     → 删除行程文件
     ===================================================== */

  else if (
    type === "itinerary"
  ) {

    const itineraryId =
      id;


    /*
      删除行程关联费用
    */

    trip.expense =
      (trip.expense || [])
      .filter(
        expense =>
          !(
            expense.itineraryId != null &&
            String(
              expense.itineraryId
            ) ===
            String(itineraryId)
          )
      );


    /*
      删除行程文件
    */

    try {

      const files =
        await getFilesForItinerary(
          itineraryId
        );

      for (
        const file of files
      ) {

        await deleteFileFromDB(
          file.id
        );

      }

    }
    catch(error) {

      console.error(
        "清理行程文件失败",
        error
      );

    }


    /*
      删除行程本身
    */

    trip.itinerary =
      trip.itinerary.filter(
        item =>
          String(item.id) !==
          String(itineraryId)
      );

  }


  /* =====================================================
     删除酒店 / 交通 / 美食景点
     → 对应行程删除
     → 对应费用删除
     ===================================================== */

  else if (
    type === "hotel" ||
    type === "transport" ||
    type === "places"
  ) {

    /*
      先找出所有相关行程
    */

    const linkedItineraries =
      (trip.itinerary || [])
      .filter(
        itineraryItem =>
          itineraryItem.sourceType ===
            type &&
          String(
            itineraryItem.sourceId
          ) ===
          String(id)
      );


    const linkedIds =
      linkedItineraries.map(
        itinerary =>
          itinerary.id
      );


    /*
      删除这些行程对应的费用
    */

    trip.expense =
      (trip.expense || [])
      .filter(
        expense =>
          !linkedIds.some(
            itineraryId =>
              expense.itineraryId != null &&
              String(
                expense.itineraryId
              ) ===
              String(itineraryId)
          )
      );


    /*
      删除这些行程的文件
    */

    for (
      const itineraryId of linkedIds
    ) {

      try {

        const files =
          await getFilesForItinerary(
            itineraryId
          );

        for (
          const file of files
        ) {

          await deleteFileFromDB(
            file.id
          );

        }

      }
      catch(error) {

        console.error(
          "清理关联行程文件失败",
          error
        );

      }

    }


    /*
      删除对应行程
    */

    trip.itinerary =
      (trip.itinerary || [])
      .filter(
        itineraryItem =>
          !(
            itineraryItem.sourceType ===
              type &&
            String(
              itineraryItem.sourceId
            ) ===
            String(id)
          )
      );


    /*
      最后删除酒店 / 交通 /
      美食景点本身
    */

    trip[type] =
      (trip[type] || [])
      .filter(
        item =>
          String(item.id) !==
          String(id)
      );

  }


  else {

    /*
      其他类型的安全处理
    */

    trip[type] =
      (trip[type] || [])
      .filter(
        item =>
          String(item.id) !==
          String(id)
      );

  }


  saveTrips();


  viewingId = null;

  viewingType = null;


  renderTrip();

}


/* =========================================================
   ★ 第一次加载时，把现有已关联资料同步一次
   ========================================================= */

syncAllExistingLinks();

saveTrips();

/*
  ☁️ 启动 Supabase 多人共享
*/
initCloudSync();


</script>
