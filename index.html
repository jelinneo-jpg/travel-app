<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#f3a77f">

<title>我们的旅行 ✈️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff9f5;
  color: #4d4140;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 900px;
  margin: auto;
  padding-bottom: 100px;
}


/* =========================
   Header
========================= */

.header {
  padding: 28px 18px 18px;
}

.logo {
  font-size: 28px;
  font-weight: 800;
}

.header-subtitle {
  margin-top: 5px;
  color: #968783;
  font-size: 14px;
}


/* =========================
   首页
========================= */

.home-content {
  padding: 0 16px;
}

.home-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 5px 2px 15px;
}

.home-title {
  font-size: 21px;
  font-weight: 800;
}

.add-trip-button {
  border: 0;

  background: #efa37c;
  color: white;

  padding: 10px 13px;

  border-radius: 13px;

  font-weight: 700;
}


/* =========================
   Trip Card
========================= */

.trip-list-card {
  position: relative;

  margin-bottom: 15px;
  padding: 22px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff0e7
    );

  border: 1px solid #f2ddd2;

  border-radius: 24px;

  box-shadow:
    0 10px 30px
    rgba(120,80,60,.08);

  transition: transform .15s;
}

.trip-list-card:active {
  transform: scale(.98);
}

.trip-card-click {
  cursor: pointer;
}

.trip-card-title {
  font-size: 22px;
  font-weight: 800;

  padding-right: 35px;
}

.trip-card-date {
  margin-top: 7px;

  color: #968783;

  font-size: 14px;
}

.trip-card-members {
  display: flex;
  flex-wrap: wrap;

  gap: 6px;

  margin-top: 15px;
}

.member {
  padding: 6px 10px;

  border-radius: 999px;

  background: white;

  border: 1px solid #efd9ce;

  font-size: 12px;
}

.trip-arrow {
  position: absolute;

  right: 20px;
  top: 50%;

  transform: translateY(-50%);

  font-size: 25px;

  color: #d99270;
}

.trip-card-actions {
  display: flex;

  gap: 7px;

  margin-top: 15px;
}

.small-action {
  padding: 8px 11px;

  border-radius: 10px;

  border: 1px solid #efddd3;

  background: white;

  color: #665957;

  font-size: 12px;
}

.small-delete {
  color: #d76c6c;
}


/* =========================
   Trip Header
========================= */

.trip-header-card {
  margin: 0 16px 12px;

  padding: 20px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff0e7
    );

  border: 1px solid #f2ddd2;

  border-radius: 24px;

  box-shadow:
    0 10px 30px
    rgba(120,80,60,.07);
}

.back-button {
  border: 0;

  background: transparent;

  padding: 0;

  color: #c9744f;

  font-weight: 700;

  margin-bottom: 12px;
}

.trip-header-title {
  font-size: 24px;
  font-weight: 800;
}

.trip-header-date {
  margin-top: 6px;

  color: #968783;

  font-size: 14px;
}

.trip-header-members {
  display: flex;
  flex-wrap: wrap;

  gap: 6px;

  margin-top: 13px;
}


/* =========================
   Tabs
========================= */

.tabs {
  position: sticky;

  top: 0;

  z-index: 10;

  display: flex;

  gap: 8px;

  padding: 7px 16px 12px;

  overflow-x: auto;

  background:
    rgba(255,249,245,.96);

  backdrop-filter: blur(10px);
}

.tab {
  flex-shrink: 0;

  border: 1px solid #efdcd3;

  background: white;

  color: #8c7d79;

  padding: 10px 14px;

  border-radius: 14px;
}

.tab.active {
  color: white;

  background: #efa37c;

  border-color: #efa37c;
}


/* =========================
   Content
========================= */

.content {
  padding: 0 16px;
}

.section-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin: 18px 2px 12px;
}

.section-header h2 {
  margin: 0;

  font-size: 20px;
}

.add-button {
  border: 0;

  background: #efa37c;
  color: white;

  padding: 10px 14px;

  border-radius: 13px;

  font-weight: 700;
}


/* =========================
   行程
========================= */

.day {
  margin-bottom: 22px;
}

.day-title {
  margin: 10px 2px;

  font-size: 18px;

  font-weight: 800;
}

.item {
  margin: 9px 0;

  padding: 15px;

  background: white;

  border: 1px solid #f0ded5;

  border-radius: 18px;

  box-shadow:
    0 7px 22px
    rgba(120,80,60,.06);
}

.item-top {
  display: flex;

  justify-content: space-between;

  gap: 10px;
}

.item-name {
  font-size: 16px;

  font-weight: 800;
}

.item-time {
  color: #e28c65;

  font-weight: 800;

  white-space: nowrap;
}

.item-info {
  margin-top: 8px;

  color: #8c7d79;

  font-size: 13px;

  line-height: 1.7;
}

.item-actions {
  display: flex;

  flex-wrap: wrap;

  gap: 7px;

  margin-top: 12px;
}

.action-button,
.link-button {
  display: inline-block;

  padding: 8px 10px;

  border-radius: 10px;

  border: 1px solid #efddd3;

  background: white;

  color: #665957;

  text-decoration: none;

  font-size: 13px;
}

.link-button {
  background: #fff2e9;

  color: #c9744f;
}

.delete-button {
  color: #d76c6c;
}


/* =========================
   添加费用按钮
========================= */

.expense-add-button {
  display: inline-block;

  padding: 8px 11px;

  border-radius: 10px;

  border: 1px solid #f1cdbb;

  background: #fff1e8;

  color: #c96f48;

  font-size: 13px;

  font-weight: 700;
}


/* =========================
   费用
========================= */

.expense-card {
  margin: 10px 0;

  padding: 17px;

  background: white;

  border: 1px solid #f0ded5;

  border-radius: 18px;

  box-shadow:
    0 7px 22px
    rgba(120,80,60,.06);
}

.expense-card-title {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  font-size: 16px;

  font-weight: 800;
}

.expense-amount {
  color: #df7c51;

  white-space: nowrap;

  font-size: 17px;

  font-weight: 800;
}

.expense-meta {
  margin-top: 8px;

  color: #8c7d79;

  font-size: 13px;

  line-height: 1.7;
}

.expense-source {
  margin-top: 10px;

  padding: 9px 11px;

  border-radius: 11px;

  background: #fff6f1;

  color: #c9744f;

  font-size: 12px;
}

.split-box {
  margin-top: 10px;

  padding: 10px 12px;

  background: #fdf8f5;

  border-radius: 12px;

  color: #756763;

  font-size: 13px;
}

.expense-note {
  margin-top: 8px;

  color: #8c7d79;

  font-size: 13px;
}


/* =========================
   Total
========================= */

.total-card {
  margin: 12px 0;

  padding: 20px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff1e8
    );

  border: 1px solid #efdcd2;

  border-radius: 20px;
}

.total-label {
  color: #958580;

  font-size: 13px;
}

.total-money {
  margin-top: 5px;

  font-size: 30px;

  font-weight: 800;
}

.expense-hint {
  margin: 0 2px 12px;

  color: #978984;

  font-size: 12px;
}


/* =========================
   Empty
========================= */

.empty {
  padding: 38px 15px;

  text-align: center;

  color: #978984;

  background: white;

  border: 1px dashed #ead7ce;

  border-radius: 18px;
}


/* =========================
   Modal
========================= */

.modal-overlay {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 100;

  padding: 18px;

  align-items: flex-end;

  justify-content: center;

  background:
    rgba(50,35,30,.38);
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: min(650px,100%);

  max-height: 92vh;

  overflow-y: auto;

  padding: 21px;

  background: white;

  border-radius:
    25px 25px 17px 17px;
}

.modal-title {
  margin: 0 0 16px;

  font-size: 21px;

  font-weight: 800;
}

label {
  display: block;

  margin: 12px 0 6px;

  color: #8d7e79;

  font-size: 13px;
}

input,
textarea,
select {
  width: 100%;

  padding: 12px;

  border: 1px solid #ead9d1;

  border-radius: 12px;

  background: #fffaf7;

  color: #4d4140;

  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #efa37c;
}

textarea {
  min-height: 80px;

  resize: vertical;
}

.form-row {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.modal-buttons {
  display: flex;

  justify-content: flex-end;

  gap: 8px;

  margin-top: 18px;
}

.cancel-button,
.save-button {
  padding: 11px 15px;

  border-radius: 12px;
}

.cancel-button {
  border: 1px solid #ead9d1;

  background: white;
}

.save-button {
  border: 0;

  background: #efa37c;

  color: white;

  font-weight: 700;
}


/* =========================
   Members
========================= */

.member-select {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;
}

.member-check {
  display: inline-flex;

  align-items: center;

  gap: 5px;

  padding: 8px 11px;

  border: 1px solid #ead9d1;

  border-radius: 999px;

  background: #fffaf7;

  font-size: 13px;
}

.member-check input {
  width: auto;
}


/* =========================
   费用 Participants
========================= */

.participant-select {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;
}

.participant-check {
  display: inline-flex;

  align-items: center;

  gap: 5px;

  padding: 8px 11px;

  border: 1px solid #ead9d1;

  border-radius: 999px;

  background: #fffaf7;

  font-size: 13px;
}

.participant-check input {
  width: auto;
}


/* =========================
   手机
========================= */

@media (max-width:600px) {

  .form-row {
    grid-template-columns: 1fr;
  }

  .trip-card-title {
    font-size: 20px;
  }

  .item-top {
    align-items: flex-start;
  }

  .expense-card-title {
    align-items: flex-start;
  }

}

</style>

</head>


<body>


<div class="app">

  <header class="header">

    </div>

    <div class="header-subtitle">

    </div>

  </header>


  <div id="appContent"></div>

</div>



<!-- =========================
     Modal
========================= -->

<div
  class="modal-overlay"
  id="modalOverlay">

  <div class="modal">

    <h3
      class="modal-title"
      id="modalTitle">

      添加

    </h3>

    <div id="formArea"></div>

        class="cancel-button"

        取消

        id="saveButton">

    </div>

<script>


/* =========================================================
   成员
========================================================= */

const MEMBERS = [
  "Lynn",
  "Vincent",

  "Tong"
];



/* =========================================================
   默认 Trip
========================================================= */

const DEFAULT_TRIPS = [

  {

    id: 1,

    name:
      "🇭🇰 香港 → 广州 → 成都 → 三江",

    ],


    itinerary: [

      {

        id: 101,

        date:

        time:
          "10:00",

        icon:
          "✈️",

        name:
          "新加坡 → 香港",

        place:
          "香港机场",

        member:
          "Lynn",

        note:
          "抵达后前往酒店",

          "",

        map:
          ""

      },


      {

        id: 102,

          "2026-11-06",

        time:
          "16:00",

        icon:
          "🏨",

        name:
          "酒店 Check-in",

        place:
          "九龙",

        member:
          "Vincent",

        note:
          "",

        link:
          "",

        map:
          ""

      },


      {

        id: 103,

        date:
          "2026-11-07",

        time:
          "19:00",

        icon:
          "🍜",

        name:
          "晚餐",

        place:
          "尖沙咀",

        member:
          "Esther",

        note:
          "",

        link:
          "",

        map:
          ""

      },


      {

        id: 104,

        date:
          "2026-11-08",

        time:
          "12:30",

        icon:
          "🚄",

        name:
          "香港 → 广州",

        place:
          "香港西九龙",

        member:
          "Tong",

        note:
          "高铁",

        link:
          "",

        map:
          ""

      }

    ],


    hotel: [],

    transport: [],

    places: [],

    expense: []

  }

];



/* =========================================================
   读取 Trips
========================================================= */

let trips =
  JSON.parse(
    localStorage.getItem(
      "travelTrips"
    )
  ) || DEFAULT_TRIPS;



/* =========================================================
   当前 Trip
========================================================= */

let currentTripId = null;

let currentPage =
  "itinerary";

let editingId = null;

let editingType = null;

let expenseItineraryId = null;



/* =========================================================
   保存
========================================================= */

function saveTrips() {

  localStorage.setItem(
    "travelTrips",
    JSON.stringify(trips)
  );

}



/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================================
   日期
========================================================= */

function formatDate(dateString) {

  if (!dateString) return "";

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  return date.toLocaleDateString(
    "zh-CN",
    {
      month: "long",
      day: "numeric",
      weekday: "short"
    }
  );

}



/* =========================================================
   首页
========================================================= */

function renderHome() {

  const app =
    document.getElementById(
      "appContent"
    );


  let html = `

    <main class="home-content">

      <div class="home-title-row">

        <div class="home-title">
          🧳 我的 Trips
        </div>

        <button
          class="add-trip-button"
          onclick="openTripModal()">

          ＋ 新增 Trip

        </button>

      </div>

  `;


  if (!trips.length) {

    html += `

      <div class="empty">

        还没有 Trip

        <br><br>

        按「＋ 新增 Trip」
        开始吧 ✨

      </div>

    `;

  }


  trips.forEach(trip => {

    html += `

      <div class="trip-list-card">

        <div
          class="trip-card-click"
          onclick="openTrip(${trip.id})">

          <div class="trip-card-title">

            ${escapeHTML(
              trip.name
            )}

          </div>

          <div class="trip-card-date">

            ${escapeHTML(
              trip.startDate
            )}

            —

            ${escapeHTML(
              trip.endDate
            )}

          </div>

          <div class="trip-card-members">

            ${
              (trip.members || [])
              .map(member => `

                <span class="member">

                  ${escapeHTML(member)}

                </span>

              `)
              .join("")
            }

          </div>

          <div class="trip-arrow">
            ›
          </div>

        </div>


        <div class="trip-card-actions">

          <button
            class="small-action"
            onclick="
              openTripModal(${trip.id});
              event.stopPropagation();
            ">

            ✏️ 编辑 Trip

          </button>


          <button
            class="small-action small-delete"
            onclick="
              deleteTrip(${trip.id});
              event.stopPropagation();
            ">

            🗑️ 删除

          </button>

        </div>

      </div>

    `;

  });


  html += `</main>`;

  app.innerHTML = html;

}



/* =========================================================
   打开 Trip
========================================================= */

function openTrip(id) {

  currentTripId = id;

  currentPage =
    "itinerary";

  renderTrip();

}



/* =========================================================
   当前 Trip
========================================================= */

function getCurrentTrip() {

  return trips.find(
    trip =>
      trip.id === currentTripId
  );

}



/* =========================================================
   Trip 页面
========================================================= */

function renderTrip() {

  const trip =
    getCurrentTrip();


  if (!trip) {

    currentTripId = null;

    renderHome();

    return;

  }


  const app =
    document.getElementById(
      "appContent"
    );


  app.innerHTML = `

    <section class="trip-header-card">

      <button
        class="back-button"
        onclick="backHome()">

        ← 所有 Trips

      </button>


      <div class="trip-header-title">

        ${escapeHTML(
          trip.name
        )}

      </div>


      <div class="trip-header-date">

        ${escapeHTML(
          trip.startDate
        )}

        —

        ${escapeHTML(
          trip.endDate
        )}

      </div>


      <div class="trip-header-members">

        ${
          (trip.members || [])
          .map(member => `

            <span class="member">

              ${escapeHTML(member)}

            </span>

          `)
          .join("")
        }

      </div>

    </section>


    <nav class="tabs">

      <button
        class="tab ${
          currentPage === "itinerary"
          ? "active"
          : ""
        }"
        onclick="
          switchPage('itinerary')
        ">

        📅 行程

      </button>


      <button
        class="tab ${
          currentPage === "hotel"
          ? "active"
          : ""
        }"
        onclick="
          switchPage('hotel')
        ">

        🏨 酒店

      </button>


      <button
        class="tab ${
          currentPage === "transport"
          ? "active"
          : ""
        }"
        onclick="
          switchPage('transport')
        ">

        🚄 交通

      </button>


      <button
        class="tab ${
          currentPage === "places"
          ? "active"
          : ""
        }"
        onclick="
          switchPage('places')
        ">

        📍 美食景点

      </button>


      <button
        class="tab ${
          currentPage === "expense"
          ? "active"
          : ""
        }"
        onclick="
          switchPage('expense')
        ">

        💰 费用

      </button>

    </nav>


    <main
      class="content"
      id="tripContent">

    </main>

  `;


  renderPage();

}



/* =========================================================
   页面切换
========================================================= */

function switchPage(page) {

  currentPage = page;

  renderTrip();

}



/* =========================================================
   Render Page
========================================================= */

function renderPage() {

  const trip =
    getCurrentTrip();


  const content =
    document.getElementById(
      "tripContent"
    );


  if (!trip) return;


  if (!trip.expense) {

    trip.expense = [];

  }


  if (currentPage === "itinerary") {

    renderItinerary(
      content,
      trip
    );

  }


  else if (
    currentPage === "expense"
  ) {

    renderExpense(
      content,
      trip
    );

  }


  else {

    renderGeneric(
      content,
      trip,
      currentPage
    );

  }

}



/* =========================================================
   行程
========================================================= */

function renderItinerary(
  content,
  trip
) {

  const items =
    [...(trip.itinerary || [])]
    .sort(
      (a,b) =>
        (
          a.date +
          a.time
        )
        .localeCompare(
          b.date +
          b.time
        )
    );


  let html = `

    <div class="section-header">

      <h2>
        📅 每日行程
      </h2>


      <button
        class="add-button"
        onclick="
          openModal('itinerary')
        ">

        ＋ 添加

      </button>

    </div>

  `;


  if (!items.length) {

    html += `

      <div class="empty">

        还没有行程

        <br><br>

        按「＋ 添加」
        开始吧 ✨

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  const groups = {};


  items.forEach(item => {

    if (!groups[item.date]) {

      groups[item.date] = [];

    }

    groups[item.date].push(item);

  });


  Object.keys(groups)

    .sort()

    .forEach(date => {

      html += `

        <div class="day">

/* =========================================================
   费用页面
========================================================= */

function renderExpense(
  content,
  trip
) {

  if (!trip.expense) {

    trip.expense = [];

  }


  const total =
    trip.expense.reduce(
      (sum,item) =>
        sum +
        Number(
          item.amount || 0
        ),
      0
    );


  let html = `

    <div class="section-header">

      <h2>
        💰 费用
      </h2>

    </div>


    <div class="expense-hint">

      💡 费用可以直接在「📅 行程」
      里面添加

    </div>


    <div class="total-card">

      <div class="total-label">

        Trip 总费用

      </div>


      <div class="total-money">

        S$${total.toFixed(2)}

      </div>

    </div>

  `;


  if (!trip.expense.length) {

    html += `

      <div class="empty">

        还没有费用记录

        <br><br>

        去「📅 行程」
        添加费用吧 💰

      </div>

    `;

    content.innerHTML = html;

    return;

  }


  const expenses =
    [...trip.expense]
    .sort(
      (a,b) =>
        (a.date || "")
        .localeCompare(
          b.date || ""
        )
    );


  expenses.forEach(item => {

    html += renderExpenseCard(
      item,
      trip
    );

  });


  content.innerHTML = html;

}

            ${participants

/* =========================================================
   Save Trip
========================================================= */

function saveTrip() {

  const name =
    document.getElementById(
      "tripName"
    ).value.trim();


  const startDate =
    document.getElementById(
      "tripStart"
    ).value;


  const endDate =
    document.getElementById(
      "tripEnd"
    ).value;


  const members =
    [
      ...document.querySelectorAll(
        ".trip-member:checked"
      )
    ]
    .map(
      input =>
        input.value
    );


  if (!name) {

    alert(
      "请输入 Trip 名称"
    );

    return;

  }


  if (
    !startDate ||
    !endDate
  ) {

    alert(
      "请选择 Trip 日期"
    );

    return;

  }


  if (
    !members.length
  ) {

    alert(
      "至少选择一位成员"
    );

    return;

  }


  if (editingId) {

    const trip =
      trips.find(
        item =>
          item.id ===
          editingId
      );


    trip.name =
      name;

    trip.startDate =
      startDate;

    trip.endDate =
      endDate;

    trip.members =
      members;

  }


  else {

    const newTrip = {

      id:
        Date.now(),

      name,

      startDate,

      endDate,

      members,

      itinerary: [],

      hotel: [],

      transport: [],

      places: [],

      expense: []

    };


    trips.push(
      newTrip
    );

  }


  saveTrips();

  closeModal();

  renderHome();

}



/* =========================================================
   Delete Trip
========================================================= */

function deleteTrip(id) {

  const trip =
    trips.find(
      item =>
        item.id === id
    );


  if (!trip) return;


  if (
    !confirm(
      `确定要删除「${trip.name}」吗？`
    )
  ) {

    return;

  }


  trips =
    trips.filter(
      item =>
        item.id !== id
    );


  saveTrips();

  renderHome();

}

          ".expense-participant:checked"
        )
      ]
      .map(
        input =>
          input.value
      );


    item = {

      id:
        editingId ||
        Date.now(),

      itineraryId:
        editingId
        ?
        (
          trip.expense.find(
            x =>
              x.id ===
              editingId
          )?.itineraryId ||
          null
        )
        :
        expenseItineraryId,

      name:
        document.getElementById(
          "fName"
        ).value.trim(),

      amount:
        Number(
          document.getElementById(
            "fAmount"
          ).value
        ) || 0,

      payer:
        document.getElementById(
          "fPayer"
        ).value,

      participants,

      date:
        document.getElementById(
          "fDate"
        ).value,

      note:
        document.getElementById(
          "fNote"
        ).value.trim()

    };

  }


  if (!item.name) {

    alert(
      "请输入名称"
    );

    return;

  }


  if (
    type === "expense" &&
    item.amount <= 0
  ) {

    alert(
      "请输入费用金额"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.payer
  ) {

    alert(
      "请选择谁付款"
    );

    return;

  }


  if (
    type === "expense" &&
    !item.participants.length
  ) {

    alert(
      "请选择至少一位分摊成员"
    );

    return;

  }


  if (editingId) {

    const index =
      trip[type].findIndex(
        x =>
          x.id ===
          editingId
      );


    if (index !== -1) {

      trip[type][index] =
        item;

    }

  }


  else {

    trip[type].push(
      item
    );

  }


  saveTrips();

  closeModal();

  renderTrip();

}



/* =========================================================
   Delete Item
========================================================= */

function deleteItem(
  type,
  id
) {

  const trip =
    getCurrentTrip();


  if (!trip) return;


  if (
    !confirm(
      "确定要删除这个项目吗？"
    )
  ) {

    return;

  }


  trip[type] =
    trip[type].filter(
      item =>
        item.id !== id
    );


  saveTrips();

  renderTrip();

}



/* =========================================================
   Close Modal
========================================================= */

function closeModal() {

  document.getElementById(
    "modalOverlay"
  )
  .classList
  .remove("show");


  editingId = null;

  editingType = null;

  expenseItineraryId = null;

}



/* =========================================================
   Back Home
========================================================= */

function backHome() {

  currentTripId = null;

  renderHome();

}



/* =========================================================
   点击背景关闭
========================================================= */

document
  .getElementById(
    "modalOverlay"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );



/* =========================================================
   初始显示
========================================================= */

renderHome();


</script>


</body>

</html>
